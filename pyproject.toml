[project]
name = "swu"
version = "0.1.0"
description = "Satellite water segmentation with cloud masking"
authors = [
  {name="Marko Marceta"}
]

dependencies = [
  "torch",
  "torchvision",
  "matplotlib",
  "pillow",
  "numpy"
]